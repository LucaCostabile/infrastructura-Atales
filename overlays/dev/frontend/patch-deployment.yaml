apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  template:
    spec:
      containers:
        - name: frontend
          image: luca011/frontend-atales:dev-latest  # CI/CD reemplaza esto
          env:
            - name: NODE_ENV
              value: "development"
            - name: DEBUG
              value: "true"

